[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-response-agent"
version = "0.1.0"
description = "Multi-agent incident response system with NVIDIA Nemotron, Laya classification, and Hindsight memory"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "litellm>=1.0.0",
    "hindsight-client",
    "chromadb>=0.4.0",
    "sqlalchemy>=2.0.0",
    "google-adk>=2.6.1",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["Copilot"]
include = ["*"]
exclude = ["tests*", "data*", "__pycache__*"]

[tool.setuptools.package-dir]
"" = "Copilot"

[tool.pytest.ini_options]
pythonpath = ["Copilot", "."]
testpaths = ["Copilot/tests"]
