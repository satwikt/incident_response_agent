# Astronomy Shop Lite Architecture: 3 Lean Microservices + Postgres + LGTM Observability + AI Copilot
# Replaces the 30-container upstream polyglot stack with a high-performance, fully-instrumented mesh.

services:
  # ── Astronomy Shop: Frontend Gateway & Web Storefront ───────────────────────
  frontend:
    build: ./services
    container_name: astronomy-frontend
    ports:
      - "9922:8080"
    environment:
      CATALOG_SERVICE_URL: http://catalog:5001
      CHECKOUT_SERVICE_URL: http://checkout:5002
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      LOKI_URL: http://loki:3100
      ENABLE_SYNTHETIC_TRAFFIC: "true"
    command: ["uvicorn", "frontend.main:app", "--host", "0.0.0.0", "--port", "8080"]
    depends_on:
      - catalog
      - checkout
    restart: unless-stopped

  # ── Astronomy Shop: Catalog & Cart Microservice ──────────────────────────────
  catalog:
    build: ./services
    container_name: astronomy-catalog
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@astronomy-db:5432/astronomy
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      LOKI_URL: http://loki:3100
    command: ["uvicorn", "catalog.main:app", "--host", "0.0.0.0", "--port", "5001"]
    depends_on:
      - astronomy-db
    restart: unless-stopped

  # ── Astronomy Shop: Checkout & Order Microservice (with Fault Engine) ────────
  checkout:
    build: ./services
    container_name: astronomy-checkout
    ports:
      - "5002:5002"
    environment:
      CATALOG_SERVICE_URL: http://catalog:5001
      DATABASE_URL: postgresql://postgres:postgres@astronomy-db:5432/astronomy
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      LOKI_URL: http://loki:3100
    command: ["uvicorn", "checkout.main:app", "--host", "0.0.0.0", "--port", "5002"]
    depends_on:
      - catalog
      - astronomy-db
    restart: unless-stopped

  # ── Database: PostgreSQL 16 ──────────────────────────────────────────────────
  astronomy-db:
    image: postgres:16-alpine
    container_name: astronomy-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: astronomy
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  # ── Observability: Prometheus ───────────────────────────────────────────────
  prometheus:
    image: quay.io/prometheus/prometheus:v3.13.3
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped

  # ── Observability: Grafana Tempo ────────────────────────────────────────────
  tempo:
    image: grafana/tempo:latest
    container_name: astronomy-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./otel_demo/integration/astronomy-shop/tempo-config.yaml:/etc/tempo.yaml:ro
    ports:
      - "127.0.0.1:3200:3200"
      - "4318:4318"
    restart: unless-stopped

  # ── Observability: Grafana Loki ─────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.4
    container_name: astronomy-loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  # ── Observability: Grafana Dashboard ────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./otel_demo/integration/astronomy-shop/grafana/provisioning/datasources/lgtm.yaml:/etc/grafana/provisioning/datasources/lgtm.yaml:ro
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped

  # ── AI SRE Incident Copilot ─────────────────────────────────────────────────
  copilot:
    build: ./Copilot
    container_name: incident-copilot
    ports:
      - "9911:8001"
    environment:
      APP_SERVICE_NAME: ${APP_SERVICE_NAME:-checkout}
      INGEST_KEYS: ${INGEST_KEYS:-checkout:key-for-checkout,catalog:key-for-catalog,frontend:key-for-frontend}
      # NVIDIA Nemotron model tiers & LiteLLM routing
      AGENT_MODEL: ${AGENT_MODEL:-super}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NEMOTRON_NANO_MODEL: ${NEMOTRON_NANO_MODEL:-nvidia/nemotron-3.5-lightning-30b-a3b}
      NEMOTRON_SUPER_MODEL: ${NEMOTRON_SUPER_MODEL:-nvidia/nemotron-3.5-super-vl-120b-a12b}
      NEMOTRON_ULTRA_MODEL: ${NEMOTRON_ULTRA_MODEL:-nvidia/nemotron-3.5-super-vl-120b-a12b}
      # Groq fallback model
      GROQ_API_KEY: ${GROQ_API_KEY:-${HINDSIGHT_LLM_API_KEY:-}}
      GROQ_MODEL: ${GROQ_MODEL:-groq/llama-3.3-70b-versatile}
      # Observability backends (internal docker network)
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
      # Incident watcher & detection
      WATCHER_INTERVAL_MINUTES: ${WATCHER_INTERVAL_MINUTES:-1}
      ALERT_ERROR_RATE_THRESHOLD: ${ALERT_ERROR_RATE_THRESHOLD:-5}
      ALERT_LATENCY_P95_MS: ${ALERT_LATENCY_P95_MS:-1000}
      MIN_REQUESTS: ${MIN_REQUESTS:-10}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      # Hindsight memory
      MEMORY_MODE: ${MEMORY_MODE:-on}
      HINDSIGHT_URL: http://hindsight:8888
      HINDSIGHT_BANK: ${HINDSIGHT_BANK:-incident-response}
      MEMORY_MIN_SCORE: ${MEMORY_MIN_SCORE:-0.05}
      # Token budget & circuit breaker
      AGENT_MAX_RUNS_PER_HOUR: ${AGENT_MAX_RUNS_PER_HOUR:-12}
      AGENT_TIMEOUT_S: ${AGENT_TIMEOUT_S:-120}
      AGENT_MAX_LLM_CALLS: ${AGENT_MAX_LLM_CALLS:-6}
      AGENT_DAILY_TOKEN_BUDGET: ${AGENT_DAILY_TOKEN_BUDGET:-150000}
      AGENT_REASONING_EFFORT: ${AGENT_REASONING_EFFORT:-low}
      AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-4096}
      AGENT_RATE_LIMIT_RETRIES: ${AGENT_RATE_LIMIT_RETRIES:-3}
      AGENT_RATE_LIMIT_WAIT_S: ${AGENT_RATE_LIMIT_WAIT_S:-45}
      BREAKER_FAILURES: ${BREAKER_FAILURES:-3}
      BREAKER_PAUSE_S: ${BREAKER_PAUSE_S:-300}
      ALLOWED_ACTIONS: ${ALLOWED_ACTIONS:-flush_pool,restart_worker,rollback_config,rollback_release,enable_fallback}
    volumes:
      - copilot-data:/app/data
    depends_on:
      - hindsight
      - prometheus
      - tempo
      - loki
    restart: unless-stopped

  # ── Agent Memory (Hindsight) ────────────────────────────────────────────────
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: incident-hindsight
    ports:
      - "127.0.0.1:9999:9999"
    environment:
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_LLM_PROVIDER:-groq}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_LLM_MODEL:-openai/gpt-oss-20b}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_LLM_API_KEY:-}
      HINDSIGHT_API_LLM_GROQ_SERVICE_TIER: ${HINDSIGHT_LLM_GROQ_SERVICE_TIER:-on_demand}
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: ${HINDSIGHT_EMBEDDINGS_PROVIDER:-local}
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    restart: unless-stopped

  # ── Telemetry Adapter ───────────────────────────────────────────────────────
  adapter:
    build: ./otel_demo/integration/astronomy-shop
    container_name: astronomy-adapter
    environment:
      COPILOT_INGEST_URL: http://copilot:8001/ingest/events
      COPILOT_INGEST_KEYS: ${INGEST_KEYS:-checkout:key-for-checkout,catalog:key-for-catalog,frontend:key-for-frontend}
      COPILOT_WATCH_SERVICE: ${APP_SERVICE_NAME:-checkout}
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
    command:
      - "--ingest-url=http://copilot:8001/ingest/events"
      - "--ingest-keys=checkout:key-for-checkout,catalog:key-for-catalog,frontend:key-for-frontend"
      - "--watch-service=checkout"
      - "--preset=checkout-error-ratio"
      - "--preset=checkout-error-logs"
      - "--tempo-service=checkout"
      - "--prometheus-url=http://prometheus:9090"
      - "--loki-url=http://loki:3100"
      - "--tempo-url=http://tempo:3200"
      - "--interval=5"
    depends_on:
      - copilot
      - prometheus
      - tempo
      - loki
    restart: unless-stopped

volumes:
  db-data:
  copilot-data:
  hindsight-data:
