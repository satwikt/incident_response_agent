<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SRE Copilot (Google ADK)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#0B0E14',
                        surface: '#121722',
                        surface2: '#1A2130',
                        surface3: '#212a3d',
                        line: '#232B3D',
                        text: '#E7EAF0',
                        muted: '#8792A6',
                        dim: '#5B6478',
                        accent: '#F5A623',
                        accentDim: '#C8850F',
                        accentSoft: '#2E2515',
                        danger: '#F0576B',
                        dangerSoft: '#2E1A1F',
                        success: '#3ECF8E',
                    },
                    fontFamily: {
                        display: ['"Space Grotesk"', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                        mono: ['"IBM Plex Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        * {
            scrollbar-width: thin;
            scrollbar-color: #2A3245 transparent;
        }

        *::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        *::-webkit-scrollbar-thumb {
            background: #2A3245;
            border-radius: 999px;
        }

        body {
            font-family: 'Inter', sans-serif;
        }

        .blink-cursor::after {
            content: '_';
            color: #F5A623;
            animation: blink 1.1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .pulse-dot {
            position: relative;
        }

        .pulse-dot::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 999px;
            background: currentColor;
            animation: pulseRing 2s ease-out infinite;
        }

        @keyframes pulseRing {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(2.6); opacity: 0; }
        }

        .typing-dot {
            animation: typingBounce 1.2s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-4px); opacity: 1; }
        }

        .msg-prose code {
            font-family: 'IBM Plex Mono', monospace;
            background: #1A2130;
            padding: 0.1rem 0.35rem;
            border-radius: 0.3rem;
            font-size: 0.85em;
            color: #F5A623;
        }

        .msg-prose pre {
            font-family: 'IBM Plex Mono', monospace;
            background: #0F131C;
            border: 1px solid #232B3D;
            padding: 0.85rem 1rem;
            border-radius: 0.6rem;
            overflow-x: auto;
            font-size: 0.85em;
            line-height: 1.6;
            margin: 0.5rem 0;
        }

        .msg-prose pre code {
            background: none;
            padding: 0;
            color: #E7EAF0;
        }

        .msg-prose strong {
            color: #fff;
            font-weight: 600;
        }
    </style>
</head>

<body class="bg-bg text-text font-body h-screen overflow-hidden">

    <div class="flex h-full">

        <!-- Sidebar -->
        <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-40 w-72 shrink-0 bg-surface border-r border-line
           flex flex-col transition-transform duration-200 -translate-x-full lg:translate-x-0">

            <div class="px-4 pt-5 pb-4 border-b border-line">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-accent text-accent pulse-dot"></span>
                    <h1 class="font-display font-semibold text-[15px] tracking-wide">SRE Copilot</h1>
                </div>
                <p class="text-xs text-dim font-mono mt-1 pl-4.5">Google ADK agent<span class="blink-cursor"></span></p>
            </div>

            <div class="p-3">
                <button id="new-chat-btn"
                    class="w-full flex items-center justify-center gap-2 text-sm font-medium
               border border-accentDim/50 text-accent hover:bg-accentSoft
               rounded-lg py-2.5 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                        <path d="M12 5v14M5 12h14" />
                    </svg>
                    New conversation
                </button>
            </div>

            <nav id="chat-list" class="flex-1 overflow-y-auto px-2 pb-3 space-y-0.5">
                <!-- chat items -->
            </nav>

            <div id="sidebar-empty" class="hidden px-6 py-8 text-center">
                <p class="text-sm text-dim">No conversations yet.</p>
            </div>
        </aside>

        <div id="sidebar-overlay" class="hidden fixed inset-0 bg-black/50 z-30 lg:hidden"></div>

        <!-- Main Panel -->
        <main class="flex-1 flex flex-col min-w-0">

            <!-- Header -->
            <header class="h-14 shrink-0 border-b border-line flex items-center justify-between px-4 gap-3">
                <div class="flex items-center gap-3 min-w-0">
                    <button id="sidebar-toggle" class="lg:hidden text-muted hover:text-text p-1 -ml-1">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                    <input id="title-input" class="bg-transparent font-display font-semibold text-[15px] truncate outline-none
                 rounded px-1.5 -ml-1.5 focus:bg-surface2 focus:ring-1 focus:ring-accentDim/50 max-w-[50vw]"
                        value="Select a conversation" />
                </div>
                <div class="flex items-center gap-2 text-xs font-mono text-dim shrink-0">
                    <span class="w-1.5 h-1.5 rounded-full bg-success text-success pulse-dot"></span>
                    <span class="hidden sm:inline">Google ADK • Prom / Loki / Tempo</span>
                </div>
            </header>

            <!-- Messages Container -->
            <div id="messages" class="flex-1 overflow-y-auto px-4 sm:px-8">
                <div class="max-w-3xl mx-auto py-6 space-y-6" id="messages-inner"></div>
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="flex-1 flex items-center justify-center px-6">
                <div class="max-w-lg w-full text-center">
                    <h2 class="font-display text-2xl font-semibold mb-2">Google ADK SRE Copilot</h2>
                    <p class="text-muted text-sm mb-4">Ask any question about errors, latency, logs, traces, or health. Gemini will execute tools autonomously.</p>
                    <div class="grid grid-cols-2 gap-2 text-xs text-left font-mono">
                        <button onclick="sendQuickPrompt('What is the current error rate across all routes?')" class="p-3 bg-surface border border-line rounded-lg hover:border-accent/40 transition-colors">
                            ⚡ "What is the current error rate?"
                        </button>
                        <button onclick="sendQuickPrompt('Check p95 latency and show slow traces')" class="p-3 bg-surface border border-line rounded-lg hover:border-accent/40 transition-colors">
                            🐢 "Check latency & slow traces"
                        </button>
                        <button onclick="sendQuickPrompt('Fetch recent error logs and identify root cause')" class="p-3 bg-surface border border-line rounded-lg hover:border-accent/40 transition-colors">
                            📜 "Fetch error logs & root cause"
                        </button>
                        <button onclick="sendQuickPrompt('Check service health and list failing components')" class="p-3 bg-surface border border-line rounded-lg hover:border-accent/40 transition-colors">
                            🛠️ "Check health & list failures"
                        </button>
                    </div>
                </div>
            </div>

            <!-- Composer -->
            <div class="border-t border-line px-4 sm:px-8 py-4">
                <form id="composer" class="max-w-3xl mx-auto flex items-end gap-2.5">
                    <div class="flex-1 bg-surface2 border border-line focus-within:border-accentDim/60 rounded-xl px-4 py-2.5 transition-colors">
                        <textarea id="composer-input" rows="1"
                            placeholder="Ask about system state or describe an incident…"
                            class="w-full bg-transparent resize-none outline-none text-sm text-text placeholder-dim max-h-40"></textarea>
                    </div>
                    <button type="submit" id="send-btn"
                        class="shrink-0 w-10 h-10 rounded-xl bg-accent hover:bg-accentDim text-bg flex items-center justify-center
                 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14M13 5l7 7-7 7" />
                        </svg>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- Confirm Modal -->
    <div id="confirm-modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/60 px-4">
        <div class="bg-surface border border-line rounded-xl max-w-sm w-full p-5">
            <h3 class="font-display font-semibold text-[15px] mb-1.5">Delete conversation?</h3>
            <p class="text-sm text-muted mb-5">This action cannot be undone.</p>
            <div class="flex justify-end gap-2">
                <button id="confirm-cancel" class="text-sm px-3.5 py-2 rounded-lg border border-line text-muted hover:text-text">Cancel</button>
                <button id="confirm-delete" class="text-sm px-3.5 py-2 rounded-lg bg-danger text-white">Delete</button>
            </div>
        </div>
    </div>

    <div id="toast" class="hidden fixed bottom-5 right-5 z-50 bg-dangerSoft border border-danger/40 text-sm text-text px-4 py-3 rounded-lg shadow-lg max-w-xs"></div>

    <script>
        (() => {
            const API_BASE = window.location.origin;

            const el = {
                chatList: document.getElementById('chat-list'),
                sidebarEmpty: document.getElementById('sidebar-empty'),
                newChatBtn: document.getElementById('new-chat-btn'),
                titleInput: document.getElementById('title-input'),
                messages: document.getElementById('messages'),
                messagesInner: document.getElementById('messages-inner'),
                emptyState: document.getElementById('empty-state'),
                composer: document.getElementById('composer'),
                composerInput: document.getElementById('composer-input'),
                sendBtn: document.getElementById('send-btn'),
                sidebar: document.getElementById('sidebar'),
                sidebarOverlay: document.getElementById('sidebar-overlay'),
                sidebarToggle: document.getElementById('sidebar-toggle'),
                confirmModal: document.getElementById('confirm-modal'),
                confirmCancel: document.getElementById('confirm-cancel'),
                confirmDelete: document.getElementById('confirm-delete'),
                toast: document.getElementById('toast'),
            };

            let chats = [];
            let currentChatId = null;
            let pendingDeleteId = null;
            let isSending = false;

            function showToast(msg) {
                el.toast.textContent = msg;
                el.toast.classList.remove('hidden');
                setTimeout(() => el.toast.classList.add('hidden'), 3500);
            }

            async function api(path, opts = {}) {
                const res = await fetch(API_BASE + path, {
                    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
                    ...opts,
                });
                if (!res.ok) {
                    const j = await res.json().catch(() => ({}));
                    throw new Error(j.detail || res.statusText);
                }
                return res.json();
            }

            function escapeHtml(str) {
                return (str || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            }

            function renderMarkdownLite(raw) {
                let text = escapeHtml(raw);
                text = text.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`);
                text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
                text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                text = text.replace(/\n/g, '<br>');
                return text;
            }

            function scrollToBottom() {
                el.messages.scrollTop = el.messages.scrollHeight;
            }

            function renderChatList() {
                el.chatList.innerHTML = '';
                el.sidebarEmpty.classList.toggle('hidden', chats.length > 0);

                chats.forEach(chat => {
                    const active = chat.id === currentChatId;
                    const item = document.createElement('div');
                    item.className = `group relative flex items-center gap-1 rounded-lg pr-1.5 pl-3 py-2.5 cursor-pointer transition-colors ${active ? 'bg-surface2' : 'hover:bg-surface2/60'}`;
                    if (active) {
                        const bar = document.createElement('span');
                        bar.className = 'absolute left-0 top-1.5 bottom-1.5 w-[3px] rounded-full bg-accent';
                        item.appendChild(bar);
                    }

                    const titleSpan = document.createElement('span');
                    titleSpan.className = 'flex-1 truncate text-sm ' + (active ? 'text-text' : 'text-muted');
                    titleSpan.textContent = chat.title;
                    item.appendChild(titleSpan);

                    const delBtn = document.createElement('button');
                    delBtn.className = 'p-1.5 text-dim hover:text-danger rounded opacity-0 group-hover:opacity-100 transition-opacity';
                    delBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>`;
                    delBtn.onclick = (e) => { e.stopPropagation(); openDeleteConfirm(chat.id); };
                    item.appendChild(delBtn);

                    item.addEventListener('click', () => selectChat(chat.id));
                    el.chatList.appendChild(item);
                });
            }

            async function loadChats() {
                try {
                    chats = await api('/chats');
                    renderChatList();
                } catch (err) {
                    showToast('Could not load conversations');
                }
            }

            async function createNewChat() {
                try {
                    const res = await api('/chat/new', { method: 'POST' });
                    chats.unshift({ id: res.id, title: 'New Chat' });
                    selectChat(res.id);
                } catch (err) {
                    showToast('Failed to create new chat');
                }
            }

            async function selectChat(id) {
                currentChatId = id;
                renderChatList();
                el.emptyState.classList.add('hidden');
                el.messages.classList.remove('hidden');
                el.messagesInner.innerHTML = '<p class="text-center text-dim text-sm font-mono py-8">loading...</p>';
                try {
                    const chat = await api(`/chat/${id}`);
                    el.titleInput.value = chat.title || 'New Chat';
                    el.messagesInner.innerHTML = '';
                    if (!chat.messages.length) {
                        el.emptyState.classList.remove('hidden');
                        el.messages.classList.add('hidden');
                    } else {
                        chat.messages.forEach(m => appendMessage(m.role, m.message, m.llm_calls));
                        scrollToBottom();
                    }
                } catch (err) {
                    showToast('Error loading chat');
                }
            }


            function appendMessage(role, content, llmCalls) {
                const wrap = document.createElement('div');
                if (role === 'user') {
                    wrap.className = 'flex justify-end';
                    wrap.innerHTML = `<div class="max-w-[75%] bg-surface2 border border-line rounded-2xl px-4 py-2.5 text-sm msg-prose">${renderMarkdownLite(content)}</div>`;
                } else {
                    wrap.className = 'flex flex-col items-start max-w-[85%]';
                    let callsHtml = '';
                    if (llmCalls !== undefined && llmCalls !== null) {
                        callsHtml = `<span class="text-[10px] text-dim font-mono ml-2 border border-line px-1.5 py-0.5 rounded-full">${llmCalls} LLM calls</span>`;
                    }
                    wrap.innerHTML = `<div class="flex items-center mb-1"><span class="text-[11px] font-mono text-accent">GOOGLE ADK AGENT</span>${callsHtml}</div><div class="text-sm leading-relaxed text-text msg-prose">${renderMarkdownLite(content)}</div>`;
                }
                el.messagesInner.appendChild(wrap);
                return wrap;
            }

            function appendTypingIndicator() {
                const wrap = document.createElement('div');
                wrap.id = 'typing-indicator';
                wrap.className = 'flex flex-col items-start';
                wrap.innerHTML = `<span class="text-[11px] font-mono text-accent mb-1.5">GOOGLE ADK AGENT</span><div class="flex items-center gap-1.5 py-1"><span class="typing-dot w-1.5 h-1.5 rounded-full bg-dim"></span><span class="typing-dot w-1.5 h-1.5 rounded-full bg-dim"></span><span class="typing-dot w-1.5 h-1.5 rounded-full bg-dim"></span></div>`;
                el.messagesInner.appendChild(wrap);
                scrollToBottom();
            }

            async function sendMessage(text) {
                if (!text.trim() || isSending) return;
                isSending = true;
                el.sendBtn.disabled = true;

                if (currentChatId == null) {
                    const res = await api('/chat/new', { method: 'POST' });
                    const newTitle = text.slice(0, 30);
                    chats.unshift({ id: res.id, title: newTitle });
                    currentChatId = res.id;
                    api(`/chat/${res.id}/rename`, { method: 'PUT', body: JSON.stringify({ title: newTitle }) }).catch(() => {});
                    renderChatList();
                }

                el.emptyState.classList.add('hidden');
                el.messages.classList.remove('hidden');
                appendMessage('user', text);
                el.composerInput.value = '';
                scrollToBottom();
                appendTypingIndicator();

                try {
                    const res = await api(`/ask/${currentChatId}`, { method: 'POST', body: JSON.stringify({ message: text }) });
                    document.getElementById('typing-indicator')?.remove();
                    appendMessage('agent', res.response, res.llm_calls);
                    scrollToBottom();
                } catch (err) {
                    document.getElementById('typing-indicator')?.remove();
                    appendMessage('agent', `**Agent request failed:** ${escapeHtml(err.message)}`);
                } finally {
                    isSending = false;
                    el.sendBtn.disabled = false;
                }
            }

            window.sendQuickPrompt = (txt) => {
                el.composerInput.value = txt;
                sendMessage(txt);
            };

            function openDeleteConfirm(id) {
                pendingDeleteId = id;
                el.confirmModal.classList.remove('hidden');
                el.confirmModal.classList.add('flex');
            }

            el.confirmCancel.onclick = () => el.confirmModal.classList.add('hidden');
            el.confirmDelete.onclick = async () => {
                if (!pendingDeleteId) return;
                await api(`/chat/${pendingDeleteId}`, { method: 'DELETE' });
                chats = chats.filter(c => c.id !== pendingDeleteId);
                el.confirmModal.classList.add('hidden');
                if (currentChatId === pendingDeleteId) {
                    currentChatId = null;
                    el.messagesInner.innerHTML = '';
                    el.emptyState.classList.remove('hidden');
                    el.messages.classList.add('hidden');
                }
                renderChatList();
            };

            el.newChatBtn.onclick = createNewChat;
            el.composer.onsubmit = (e) => { e.preventDefault(); sendMessage(el.composerInput.value); };
            el.composerInput.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(el.composerInput.value); } };

            loadChats();
        })();
    </script>
</body>
</html>
