name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  copilot-tests:
    name: Copilot Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Vectorize documentation for RAG
        run: |
          python3 Copilot/scripts/index_docs.py \
            --docs-path otel_demo/docs \
            --chroma-path Copilot/data/chroma_db \
            --index-path Copilot/data/docs_index.json

      - name: Run Pytest test suite
        run: |
          pytest Copilot/tests -q

  compose-validate:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose configuration
        run: |
          INGEST_KEY=ci docker compose config --quiet

  hygiene:
    name: Repository Hygiene & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify no unallowed env, database, or bytecode files tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.db$|\.sqlite3?$|\.pyc$'; then
            echo "Forbidden file tracked in git repository!"
            exit 1
          fi

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
