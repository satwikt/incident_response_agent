global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "astronomy-frontend"
    metrics_path: /metrics
    static_configs:
      - targets: ["frontend:8080"]

  - job_name: "astronomy-catalog"
    metrics_path: /metrics
    static_configs:
      - targets: ["catalog:5001"]

  - job_name: "astronomy-checkout"
    metrics_path: /metrics
    static_configs:
      - targets: ["checkout:5002"]
